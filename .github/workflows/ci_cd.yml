name: CI Pipeline
run-name: Exécution de la CI par @${{ github.actor }}
permissions:
  contents: read
on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
env:
  NODE_VERSION: '20'
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  format:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run format

  test:
    needs: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL_AUTH: ${{ secrets.VITE_API_URL_AUTH }}
          VITE_API_URL_ORDER_SERVICE: ${{ secrets.VITE_API_URL_ORDER_SERVICE }}
          VITE_AI_PROVIDER: ${{ secrets.VITE_AI_PROVIDER }}
          VITE_ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy-vps:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'dist/,Containerfile,nginx.conf'
          target: '~/ms-market-front'

      - name: Build & restart container in pod
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_REF_NAME
          script: |
            set -e
            cd ~/ms-market-front
            VERSION="${GITHUB_REF_NAME#v}"
            podman build \
              -t ms-market-front-pod/ms-market-front:latest \
              -t ms-market-front-pod/ms-market-front:$VERSION \
              -f Containerfile .
            podman pod exists ms-market-front-pod || podman pod create --name ms-market-front-pod -p 8110:80
            podman stop ms-market-front || true
            podman rm ms-market-front || true
            podman run -d --pod ms-market-front-pod --name ms-market-front \
              --restart=always \
              ms-market-front-pod/ms-market-front:$VERSION
            podman images ms-market-front-pod/ms-market-front --format "{{.Tag}}" \
              | grep -v latest \
              | sort -Vr \
              | tail -n +6 \
              | xargs -I {} podman rmi ms-market-front-pod/ms-market-front:{} 2>/dev/null || true
